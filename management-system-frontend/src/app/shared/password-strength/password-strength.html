<div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
        <div class="flex gap-1"
             role="meter"
             aria-label="Password strength"
             aria-valuemin="0"
             [attr.aria-valuemax]="rules().length"
             [attr.aria-valuenow]="score()"
             [attr.aria-valuetext]="level()?.label ?? 'Empty'">
            @for (segment of segments; track segment) {
            <span class="h-1.5 flex-1 rounded-full transition-colors"
                  [class]="segment <= filled() ? color() : 'bg-surface-200 dark:bg-surface-700'"></span>
            }
        </div>
        <small class="text-muted-color">Password strength: {{ level()?.label ?? '-' }}</small>
    </div>

    <ul class="flex flex-col gap-1 text-sm">
        @for (rule of rules(); track rule.label) {
        <li class="flex items-center gap-2"
            [class]="rule.passed ? 'text-green-600 dark:text-green-400' : 'text-muted-color'">
            <i [class]="rule.passed ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
            {{ rule.label }}
        </li>
        }
    </ul>
</div>
