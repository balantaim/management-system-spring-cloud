<section class="flex min-h-[60vh] items-center justify-center py-10">
    <app-card title="Administration">
        <p class="mb-4 text-center text-muted-color">Only users with the ROLE_ADMIN authority can see this page.</p>
        <ul class="flex flex-wrap justify-center gap-2">
            @for (authority of authorities(); track authority) {
            <li class="rounded-full bg-surface-100 px-3 py-1 text-xs dark:bg-surface-800">{{ authority }}</li>
            }
        </ul>
    </app-card>
</section>
