<section class="flex min-h-[60vh] items-center justify-center py-10">
    <app-card>
        <div class="flex flex-col items-center gap-4 text-center">
            <i class="pi pi-compass text-5xl text-primary"></i>
            <p class="text-6xl font-bold text-primary">404</p>
            <h1 class="text-2xl font-semibold">Page not found</h1>
            <p class="text-muted-color">
                The page you are looking for doesn't exist or has been moved.
            </p>

            <div class="mt-4 flex flex-wrap justify-center gap-3">
                <a routerLink="/home"
                   class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2 font-medium text-white hover:opacity-90">
                    <i class="pi pi-home"></i>Go to home
                </a>
                <button type="button"
                        class="inline-flex cursor-pointer items-center gap-2 rounded-md border border-surface px-4 py-2 font-medium hover:bg-surface-100 dark:hover:bg-surface-800"
                        (click)="goBack()">
                    <i class="pi pi-arrow-left"></i>Go back
                </button>
            </div>
        </div>
    </app-card>
</section>
