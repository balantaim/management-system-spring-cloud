server:
  port: ${PORT:0}
spring:
  profiles:
    active: local
  # Hikari pool
  datasource:
    hikari:
      pool-name: management-system-image-creator
      maximum-pool-size: 5
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    # Keeping a persistence context open for the entire web request (default: true)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: true
        jdbc:
          time_zone: UTC
      show-sql: true
  application:
    name: management-system-image-creator
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  # File configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

