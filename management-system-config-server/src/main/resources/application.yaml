server:
  port: 8888
spring:
  application:
    name: management-system-config-server
  profiles:
    active: vault
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh,mappings,env
  endpoint:
    health:
      show-details: always